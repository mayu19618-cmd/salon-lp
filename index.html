<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumiere</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fff; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <picture>
    <!-- スマホ（幅 768px 以下）: lp-mobile.png を表示 -->
    <source srcset="lp-mobile.png" media="(max-width: 768px)">
    <!-- PC: lp.png を表示 -->
    <img src="lp.png" alt="Lumiere LP">
  </picture>
</body>
</html>
