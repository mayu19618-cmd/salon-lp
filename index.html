  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /*
      横スクロール抑制。
      transform: scale() はレイアウトサイズを変えないため、
      縮小時に右側にはみ出すレイアウト領域を overflow-x: hidden で隠す。
    */
    html, body {
      overflow-x: hidden;
      background: #fff;
    }

    /*
      Figmaフレーム (14:89)。
      JS が transform: scale() と margin-bottom の補正を動的に設定する。
      transform-origin: top left → 左上起点で縮小し、JS側で水平中央揃えを行う。
    */
    .lp-frame {
      position: relative;
      width: 1574px;
      height: 8287px;
      transform-origin: top left;
    }

    /* 全直接子要素を絶対配置（Figmaの座標系を再現するために必須） */
    .lp-frame > * {
      position: absolute;
    }

    /* クロップコンテナ（woman-photo.png を複数箇所でトリミング） */
    .crop {
      overflow: hidden;
    }

    .crop img {
      position: absolute;
      max-width: none;
    }

    /* CTAボタン（<a>要素、ホバーオーバーレイ付き） */
    .cta-btn {
      cursor: pointer;
      display: block;
      padding: 0;
      overflow: hidden;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .cta-btn img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /*
      ホバー時オーバーレイ:
      #D0E4F5（水色）を不透明度0→15%に変化させる。
      元画像の文字・影・立体感はそのまま維持される。
    */
    .cta-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(208, 228, 245, 0);
      transition: background-color 0.25s ease;
      pointer-events: none;
    }

    .cta-btn:hover::after,
    .cta-btn:focus-visible::after {
      background: rgba(208, 228, 245, 0.15);
    }

    /* キーボードフォーカス時のアウトライン（マウス操作では非表示） */
    .cta-btn:focus-visible {
      outline: 3px solid #3b8ed4;
      outline-offset: 3px;
    }
  </style>
</head>

  <script>
    /*
     * CTA_URL — CTAボタン全4箇所の遷移先URLをここ1箇所で管理する。
     * 変更するときはこの値だけ書き換えれば全ボタンに反映される。
     */
    var CTA_URL = 'https://www.google.com/?hl=ja';

    /* 全CTAボタン（.cta-btn）にURL・ターゲット・rel を一括設定 */
    document.querySelectorAll('.cta-btn').forEach(function (a) {
      a.href   = CTA_URL;
      a.target = '_blank';
      a.rel    = 'noopener noreferrer';
    });

    (function () {
      var DESIGN_W = 1574;   // Figmaフレーム幅（px）
      var DESIGN_H = 8287;   // Figmaフレーム高さ（px）

      function update() {
        var vw = document.documentElement.clientWidth;
        var scale = vw >= DESIGN_W ? 1 : vw / DESIGN_W;
        var frame = document.querySelector('.lp-frame');

        if (scale < 1) {
          /*
            縮小時:
            ・transform-origin: top left でスケール → 視覚幅 = vw（横方向がぴったり収まる）
            ・marginLeft = 0（左端揃え）
            ・margin-bottom でレイアウト高さを視覚高さに合わせて補正
              layout height (8287px) + marginBottom (負値) = DESIGN_H * scale
          */
          frame.style.transform    = 'scale(' + scale + ')';
          frame.style.marginLeft   = '0';
          frame.style.marginBottom = Math.floor(DESIGN_H * scale - DESIGN_H) + 'px';
        } else {
          /*
            原寸表示時（1574px 以上）:
            ・transform なし
            ・marginLeft で水平中央揃え
          */
          frame.style.transform    = 'none';
          frame.style.marginLeft   = Math.floor((vw - DESIGN_W) / 2) + 'px';
          frame.style.marginBottom = '0';
        }
      }

      update();
      window.addEventListener('resize', update);
    })();
  </script>
